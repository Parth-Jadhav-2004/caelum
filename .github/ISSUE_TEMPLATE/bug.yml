name: Bug report
description: Report a reproducible Caelum failure
body:
  - type: markdown
    attributes:
      value: Do not include API keys, audio, transcripts, or unredacted logs. See SECURITY.md for sensitive issues.
  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      options:
        - Stable (Latest)
        - Testing (release candidate)
        - Development artifact
        - Source checkout / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Caelum version and package filename
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: GitHub release tag or source commit
      description: Include the testing tag or the Actions run, attempt and source SHA for a development artifact. Package version alone cannot distinguish preview builds.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distro/version, desktop/compositor, Wayland or X11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized error message and relevant diagnostics
      description: Remove keys, private paths, transcripts and provider response bodies.
