name: Linux release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --locked --extra dev
      - run: uv run ruff check python tests scripts
      - run: uv run pytest -q
      - run: python3 scripts/scan_privacy.py
      - run: npm ci
      - run: npm run check
      - run: uv run python scripts/generate-contracts.py && git diff --exit-code src/lib/config.generated.ts
  package:
    name: Package ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: ubuntu-24.04, image: 'ubuntu:24.04'}
          - {target: ubuntu-26.04, image: 'ubuntu:26.04'}
          - {target: debian-12, image: 'debian:12'}
          - {target: arch, image: 'archlinux:latest'}
          - {target: fedora-43, image: 'fedora:43'}
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates python3 python3-venv build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zstd libportaudio2 pulseaudio
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm git curl python base-devel webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf zstd portaudio pulseaudio
          else
            dnf install -y git curl python3 gcc gcc-c++ make pkgconf-pkg-config webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel patchelf zstd rpm-build portaudio openssl-devel pulseaudio
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Build native executable and full Python payload
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
          fi
          uv sync --locked --extra dev --python /usr/bin/python3
          uv run python scripts/generate-contracts.py
          python3 scripts/build_package.py '${{ matrix.target }}'
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install package and verify backend without pip
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          elif command -v pacman >/dev/null; then
            pacman -U --noconfirm ./dist/*.pkg.tar.zst
          else
            dnf install -y ./dist/*.rpm
          fi
          caelum --help
          test -x /usr/bin/caelum-desktop
          printf '%s\n' '{"v":1,"id":1,"method":"bootstrap"}' | caelum-engine | python3 -c 'import sys,json; frames=[json.loads(line) for line in sys.stdin]; assert any(f.get("id")==1 and "result" in f for f in frames)'
          # Newer PortAudio builds initialize PulseAudio during import. Provide
          # a hardware-free server so this checks the installed audio library too.
          pulse_dir=$(mktemp -d)
          trap 'pulseaudio --kill || true; rm -rf "$pulse_dir"' EXIT
          export PULSE_SERVER="unix:$pulse_dir/native"
          pulseaudio -n --daemonize=yes --exit-idle-time=-1 --use-pid-file=yes \
            --load="module-native-protocol-unix socket=$pulse_dir/native auth-anonymous=1" \
            --load="module-null-sink sink_name=ci"
          PYTHONPATH=/opt/caelum/lib python3 -c 'import caelum.portable, sounddevice, numpy, httpx; assert len(sounddevice.query_devices()) > 0'
      - uses: actions/upload-artifact@v4
        with:
          name: caelum-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
  publish-release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require the pinned update verification key
        run: test -s python/caelum/update-public.pem
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Sign update metadata
        env:
          CAELUM_UPDATE_SIGNING_KEY: ${{ secrets.CAELUM_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$CAELUM_UPDATE_SIGNING_KEY" > "$key"
          unset CAELUM_UPDATE_SIGNING_KEY
          python3 scripts/sign_release.py release-assets "$key"
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Caelum $GITHUB_REF_NAME" --notes-file "docs/release-${GITHUB_REF_NAME#v}.md"
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/*.pkg.tar.zst \
            release-assets/update.json \
            release-assets/update.json.sig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
