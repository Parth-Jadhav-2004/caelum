name: Deploy product page

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "scripts/update-website-release.py"
  workflow_dispatch:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN do not emit another workflow event.
  workflow_run:
    workflows: [Promote to testing or production]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  # Main accepts independent Pages changes during the application qualification hold.
  promotion-route:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep application changes behind the desktop qualification hold
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- . ':!website/**' ':!.github/workflows/website.yml' ':!scripts/update-website-release.py' ':!tests/test_website_release.py'; then
            exit 0
          fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/26" --jq .state)
          if [[ $state != closed ]]; then
            echo "Application changes to main await the evidence in #26." >&2
            exit 1
          fi
          if [[ $GITHUB_HEAD_REF == dev ]]; then
            # The integration PR must bring exactly the tree published for testing.
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$HEAD_SHA^{tree}")"
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.prerelease and (.draft|not)) | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+-rc[.][1-9][0-9]*$"))')
            for tag in $tags; do
              if [[ $(git rev-parse --verify "refs/tags/$tag^{tree}") == "$(git rev-parse HEAD^{tree})" ]]; then exit 0; fi
            done
            echo "Publish and qualify the integration tree as a testing RC first." >&2
            exit 1
          fi
  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Generate verified stable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-website-release.py
      - name: Check release manifest and download commands
        run: node --test website/release-check.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - name: Publish product page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
