name: Deploy product page

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "scripts/update-website-release.py"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  promotion-route:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Direct pull requests to dev
        run: |
          echo "::error::Target dev. Only fast-forward main when promoting a qualified release."
          exit 1
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Generate verified stable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-website-release.py
      - name: Check release manifest and download commands
        run: node --test website/release-check.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - name: Publish product page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
