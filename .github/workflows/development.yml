name: Publish development release
on:
  workflow_run:
    workflows: [Linux candidate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful main candidate run ID to publish or resume
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: development-${{ github.event.workflow_run.id || inputs.candidate_run_id }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      attempt: ${{ steps.candidate.outputs.attempt }}
      run_id: ${{ steps.candidate.outputs.run_id }}
    steps:
      # workflow_run is privileged: resolve using main's trusted code first,
      # never a PR checkout or a caller-supplied artifact/source identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the successful candidate's origin
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
          CHANNEL: development
        run: python3 scripts/resolve_candidate.py
  publish:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Publish verified development packages without production signing access
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
        run: python3 scripts/publish_prerelease.py development release-assets "$CANDIDATE_SHA" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT"
