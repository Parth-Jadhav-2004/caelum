name: Checks
on:
  pull_request:
  push:
    branches: [dev, testing, main]
  workflow_call:
permissions:
  contents: read
jobs:
  promotion-route:
    if: github.event_name == 'pull_request' && (github.base_ref == 'testing' || github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify source branch and the exact tree being promoted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$GH_REPO"
          tree() { gh api "repos/$GH_REPO/git/commits/$1" --jq '.tree.sha'; }
          promoted=$(tree "$HEAD_SHA")
          test "$(tree "$GITHUB_SHA")" = "$promoted"
          if [[ $GITHUB_BASE_REF == testing ]]; then
            test "$GITHUB_HEAD_REF" = dev
            # The PR checks and the dev package matrix start concurrently.
            runs="repos/$GH_REPO/actions/workflows/release.yml/runs?branch=dev&head_sha=$HEAD_SHA"
            while true; do
              state=$(gh api "$runs" --jq '[.workflow_runs[] | select(.event=="push" or .event=="workflow_dispatch")] | sort_by(.id) | last | (.conclusion // .status // "pending")')
              case "$state" in
                success) break ;;
                queued|pending|waiting|requested|in_progress) sleep 20 ;;
                *) echo "Candidate for $HEAD_SHA ended with $state" >&2; exit 1 ;;
              esac
            done
          else
            test "$GITHUB_HEAD_REF" = testing
            tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.prerelease and (.draft|not)) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$"))')
            for tag in $tags; do
              sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
              if [[ $(tree "$sha") == "$promoted" ]]; then exit 0; fi
            done
            echo "Publish and qualify this exact tree on testing first." >&2
            exit 1
          fi
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.1"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 dbus-daemon
      - run: uv sync --locked --extra dev
      - run: uv run ruff check python tests scripts
      - run: uv run pytest -q
      - run: dbus-run-session -- env CAELUM_DBUS_TESTS=1 uv run pytest -q tests/test_media_dbus.py
      - run: python3 scripts/scan_privacy.py
      - run: npm ci
      - run: node --test website/release-check.mjs
      - run: npm run check
      - run: bash scripts/check-workflows.sh
      - name: Check generated contracts
        run: |
          uv run python scripts/generate-contracts.py
          git diff --exit-code -- src/lib/config.generated.ts src/lib/ipc-contract.generated.json
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-ubuntu24-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-ubuntu24-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: python3 scripts/dev-sidecar.py
      # tauri-build validates frontendDist even for a debug test build.
      - run: mkdir -p dist/frontend && touch dist/frontend/index.html
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
