name: Promote to testing or production
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a testing prerelease or promote tested packages to production
        required: true
        type: choice
        options: [testing, production]
        default: testing
      candidate_run_id:
        description: Successful Linux candidate workflow run ID (from dev)
        required: true
        type: string
      desktop_qualified:
        description: Required for production — manual docs/acceptance.md checks completed
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: publication-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      attempt: ${{ steps.candidate.outputs.attempt }}
      run_id: ${{ steps.candidate.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the successful candidate's origin
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          QUALIFIED: ${{ inputs.desktop_qualified }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/resolve_candidate.py
  testing:
    name: Publish testing prerelease
    if: inputs.channel == 'testing'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Publish the exact verified candidate as a testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
        run: python3 scripts/publish_prerelease.py testing release-assets "$CANDIDATE_SHA" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT"
  publish:
    name: Publish signed production release
    if: inputs.channel == 'production'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Require identical packages already published to testing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
        run: python3 scripts/publish_prerelease.py verify-testing release-assets "$CANDIDATE_SHA" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT"
      - name: Verify candidate, sign metadata, and resume or publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          CANDIDATE_RUN: ${{ needs.resolve.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
          CAELUM_UPDATE_SIGNING_KEY: ${{ secrets.CAELUM_UPDATE_SIGNING_KEY }}
          CAELUM_LEGACY_UPDATE_SIGNING_KEY: ${{ secrets.CAELUM_LEGACY_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key=$(mktemp)
          legacy_key=$(mktemp)
          trap 'rm -f "$key" "$legacy_key"' EXIT
          chmod 600 "$key" "$legacy_key"
          printf '%s\n' "$CAELUM_UPDATE_SIGNING_KEY" > "$key"
          unset CAELUM_UPDATE_SIGNING_KEY
          legacy_args=()
          if [[ -n "$CAELUM_LEGACY_UPDATE_SIGNING_KEY" ]]; then
            printf '%s\n' "$CAELUM_LEGACY_UPDATE_SIGNING_KEY" > "$legacy_key"
            legacy_args=(--legacy-key "$legacy_key")
          fi
          unset CAELUM_LEGACY_UPDATE_SIGNING_KEY
          python3 scripts/publish_release.py release-assets "$CANDIDATE_SHA" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT" "$key" "${legacy_args[@]}"
