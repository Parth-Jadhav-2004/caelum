name: Windows desktop
on:
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:
    inputs:
      verify_cpu_recovery:
        description: "Exercise the installed app with public Parakeet v3 weights on the CPU runner"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.1"
      - run: npm ci
      - run: npm run check
      - name: Test Windows dictation and model guidance
        run: uv run --locked --extra dev --python 3.12 pytest -q tests/test_windows_desktop.py tests/test_windows_hardware.py tests/test_orchestrator.py tests/test_cuda_runtime.py
      - run: python scripts/build_windows_runtime.py
      - run: src-tauri/windows-runtime/python.exe scripts/smoke_windows_engine.py
        timeout-minutes: 3
      - run: npx --no-install tauri build --bundles nsis
      - name: Install and exercise the bundled engine
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $dest = "$env:RUNNER_TEMP\Caelum Install"
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          & "$dest\engine\python.exe" scripts/smoke_windows_engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CAELUM_SMOKE_TEST = "1"
          $log = "$env:RUNNER_TEMP\caelum-stderr.txt"
          $gui = Get-ChildItem "$dest\*.exe" | Where-Object { $_.BaseName -in 'caelum-desktop', 'Caelum' } | Select-Object -First 1
          $app = Start-Process $gui.FullName -RedirectStandardError $log -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if (Select-String -Path $log -Pattern 'CAELUM_FRONTEND_READY_V1' -Quiet) { break }
              if ($app.HasExited) { throw "Installed app exited during startup" }
              Start-Sleep -Seconds 1
            }
            if (-not (Select-String -Path $log -Pattern 'CAELUM_FRONTEND_READY_V1' -Quiet)) {
              throw "Installed WebView2 frontend did not become ready"
            }
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }
      - name: Verify packaged Parakeet transcription and CPU recovery
        if: github.event_name == 'workflow_dispatch' && inputs.verify_cpu_recovery
        timeout-minutes: 15
        shell: pwsh
        run: |
          $py = "$env:RUNNER_TEMP\Caelum Install\engine\python.exe"
          $qa = "$env:RUNNER_TEMP\speech-qa"
          $env:LOCALAPPDATA = "$qa\data"
          $env:APPDATA = "$qa\config"
          $PSNativeCommandUseErrorActionPreference = $true
          & $py -I scripts/download-local-fixtures.py "$qa\samples"
          & $py -I -m caelum.cli models download parakeet-v3
          $smoke = @('-I', 'scripts/smoke_nvidia.py', "$env:LOCALAPPDATA\Caelum\models", "$qa\samples\librispeech-0.wav")
          & $py @smoke --device cpu
          & $py @smoke --device gpu --expect-setup-error
          & $py -I -m caelum.cli install-nvidia
          & $py @smoke --device gpu --expect-setup-error
          & $py @smoke --device auto
          # Break only the disposable add-on, leaving the packaged CPU engine intact.
          $dll = "$env:LOCALAPPDATA\Caelum\components\nvidia-cu12\Lib\site-packages\nvidia\cuda_runtime\bin\cudart64_12.dll"
          Rename-Item $dll cudart64_12.dll.hidden
          & $py @smoke --device gpu --expect-setup-error
          & $py @smoke --device auto
      - name: Name installer for the shared release manifest
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Rename-Item -NewName "caelum-$version-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Caelum-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
