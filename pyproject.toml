[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelum-dictation"
version = "0.5.4"
description = "Private-by-default dictation for Linux and Windows desktops"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "dbus-next>=0.2.3,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "sounddevice>=0.5,<1",
    "pywin32>=311; sys_platform == 'win32'",
    "cryptography>=45,<51; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]
local = ["sherpa-onnx>=2.0.1,<3"]
whisper = ["faster-whisper>=1.2,<2", "sherpa-onnx>=2.0.1,<3"]

[project.scripts]
caelum = "caelum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/caelum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "caelum/config.example.toml"
"python/caelum/model_catalog.json" = "caelum/model_catalog.json"

"python/caelum/data/silero_vad.onnx" = "caelum/data/silero_vad.onnx"
"python/caelum/data/Silero-LICENSE.txt" = "caelum/data/Silero-LICENSE.txt"
