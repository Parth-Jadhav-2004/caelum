[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelum-dictation"
version = "0.2.0"
description = "Private-by-default dictation for Linux desktops"
requires-python = ">=3.11"
dependencies = [
    "dbus-next>=0.2.3,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[project.scripts]
caelum = "caelum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caelum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "caelum/config.example.toml"
