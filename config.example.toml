# ~/.config/caelum/config.toml; credentials belong in environment variables.
[app]
backend = "auto" # auto, hyprland, or portable (GNOME/KDE/X11/manual copy)
hotkey = "SUPER + ALT + V"
# Modifier-only shortcuts such as "CTRL + SUPER" also work in either press order.
strategy = "single" # "chunked" is experimental; benchmark before enabling
max_recording_seconds = 120
minimum_recording_ms = 200
retry_expiry_seconds = 60
reduced_motion = false
high_contrast = false
# sounddevice index or device name; omit to use the system default
# microphone = "USB Audio"
silence_dbfs = -60.0 # conservative silence rejection, never an audio gate

[stt]
base_url = "https://api.groq.com/openai/v1"
model = "whisper-large-v3-turbo"
key_env = "GROQ_API_KEY"
language = "" # auto detect, or "en", "hi", etc.
vocabulary = "Caelum, Omarchy, Hyprland"
timeout_seconds = 15.0
chunk_seconds = 7.0
overlap_seconds = 0.8
concurrency = 2

[cleanup]
# Free single-key default: raw transcription until refinement is benchmarked.
# Opt in to Groq refinement with model = "openai/gpt-oss-20b".
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
model = ""
reasoning_effort = "" # omit for custom providers unless supported
timeout_seconds = 1.8

[desktop]
# Disable to dictate without saving new transcripts. Existing history is kept.
history_enabled = true
check_updates = true # Official native packages check GitHub on app launch; never auto-download.
theme = "system" # system follows desktop appearance; light and dark override it.
retention_days = 30
stt_usd_per_hour = 0.0 # 0 means unknown; configure your own rate for new-session estimates
