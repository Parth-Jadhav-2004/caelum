<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1144" viewBox="0 0 1200 1144" role="img" aria-labelledby="title desc">
<title id="title">Caelum Phase 1 floating recording pill specification</title>
<desc id="desc">A dark glass 232 by 48 logical pixel capsule sits 24 pixels above a bottom panel. Six state studies show listening, recording, processing, AI cleanup, success, and error. The overlay is click-through and never takes keyboard focus.</desc>
<defs>
  <linearGradient id="desktop" x2="1" y2="1"><stop stop-color="#303B40"/><stop offset="1" stop-color="#1D252C"/></linearGradient>
  <filter id="shadow" x="-30%" y="-70%" width="160%" height="260%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
